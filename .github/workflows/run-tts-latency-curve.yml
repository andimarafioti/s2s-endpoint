name: Run TTS latency curve

on:
  push:
    branches:
      - deploy/stt-tts-endpoints
    paths:
      - .github/workflows/run-tts-latency-curve.yml

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event.head_commit.message == 'Run TTS latency curve'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Run low-concurrency curve
        env:
          HF_TOKEN: ${{ secrets.SPEECH_BENCHMARK_HF_TOKEN }}
        run: |
          uv run --with-requirements requirements.txt \
            python scripts/benchmark_speech_service_endpoints.py \
            --services tts \
            --tts-cases three_sentences \
            --concurrencies 1 2 4 8 \
            --waves 8 \
            --timeout 1200 \
            --client-region github-actions \
            --output logs/speech-services-tts-low.json

      - name: Run saturation curve
        env:
          HF_TOKEN: ${{ secrets.SPEECH_BENCHMARK_HF_TOKEN }}
        run: |
          uv run --with-requirements requirements.txt \
            python scripts/benchmark_speech_service_endpoints.py \
            --services tts \
            --tts-cases three_sentences \
            --concurrencies 16 32 64 128 256 512 \
            --waves 1 \
            --timeout 1200 \
            --client-region github-actions \
            --output logs/speech-services-tts-high.json

      - uses: actions/upload-artifact@v4
        with:
          name: speech-services-tts-latency-curve
          path: logs/speech-services-tts-*.json
          if-no-files-found: error
