name: Publish pipeline image

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/stt-tts-endpoints
    paths:
      - .github/workflows/publish-pipeline-image.yml
      - Dockerfile.pipeline
      - pipeline_entrypoint.py

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.pipeline
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/s2s-pipeline:v0.2
          cache-from: type=gha,scope=speech-pipeline
          cache-to: type=gha,mode=max,scope=speech-pipeline
