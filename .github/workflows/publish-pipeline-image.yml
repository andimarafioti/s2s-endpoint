name: Publish pipeline image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional version alias to publish, such as v0.3
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-pipeline-image.yml
      - Dockerfile.pipeline
      - pipeline_entrypoint.py
      - app/**
      - requirements.txt

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/s2s-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable and release tags
        id: tags
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          {
            echo "value<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            if [[ -n "${RELEASE_TAG}" ]]; then
              if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                echo "release_tag must look like v0.3 or v0.3.1" >&2
                exit 1
              fi
              echo "${IMAGE}:${RELEASE_TAG}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.pipeline
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=speech-pipeline
          cache-to: type=gha,mode=max,scope=speech-pipeline
