name: Publish speech service images

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/stt-tts-endpoints
    paths:
      - .github/workflows/publish-speech-service-images.yml
      - Dockerfile.stt
      - Dockerfile.tts

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - stt
          - tts
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/s2s-${{ matrix.service }}:v0.1
          cache-from: type=gha,scope=speech-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=speech-${{ matrix.service }}
