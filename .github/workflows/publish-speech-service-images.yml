name: Publish speech service images

on:
  workflow_dispatch:
    inputs:
      service:
        description: Image to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - stt
          - tts
          - proxy
      release_tag:
        description: Optional version alias to publish, such as v0.3
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-speech-service-images.yml
      - Dockerfile.stt
      - Dockerfile.tts
      - Dockerfile.speech_proxy
      - requirements.txt
      - app/app_utils.py
      - app/speech_proxy_app.py
      - app/speech_proxy_main.py
      - app/speech_proxy_router.py

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: stt
            image: s2s-stt
            dockerfile: Dockerfile.stt
            cache_scope: speech-stt
          - service: tts
            image: s2s-tts
            dockerfile: Dockerfile.tts
            cache_scope: speech-tts
          - service: proxy
            image: s2s-speech-proxy
            dockerfile: Dockerfile.speech_proxy
            cache_scope: speech-proxy
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      SHOULD_PUBLISH: ${{ inputs.service == '' || inputs.service == 'all' || inputs.service == matrix.service }}
    steps:
      - uses: actions/checkout@v4
        if: env.SHOULD_PUBLISH == 'true'

      - uses: docker/setup-buildx-action@v4
        if: env.SHOULD_PUBLISH == 'true'

      - uses: docker/login-action@v4
        if: env.SHOULD_PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable and release tags
        if: env.SHOULD_PUBLISH == 'true'
        id: tags
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          {
            echo "value<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            if [[ -n "${RELEASE_TAG}" ]]; then
              if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                echo "release_tag must look like v0.3 or v0.3.1" >&2
                exit 1
              fi
              echo "${IMAGE}:${RELEASE_TAG}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v7
        if: env.SHOULD_PUBLISH == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
